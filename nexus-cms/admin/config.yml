backend:
  name: git-gateway
  branch: main

media_folder: "media/uploads"
public_folder: "/media/uploads"

collections:
  - name: "articulos"
    label: "Artículos"
    folder: "articulos"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Título", name: "title", widget: "string"}
      - {label: "Fecha de Publicación", name: "date", widget: "datetime"}
      - {label: "Tiempo de Lectura", name: "readtime", widget: "string", default: "10 min"}
      - {label: "Descripción Corta", name: "description", widget: "text"}
      - {label: "Contenido", name: "body", widget: "markdown"}
      - {label: "PDF Adjunto", name: "pdf", widget: "file", required: false}
      - {label: "Imagen Destacada", name: "featured_image", widget: "image", required: false}
      
  - name: "podcast"
    label: "Podcasts"
    folder: "media/podcast"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Título", name: "title", widget: "string"}
      - {label: "Episodio", name: "episode", widget: "string"}
      - {label: "Fecha", name: "date", widget: "datetime"}
      - {label: "Duración", name: "duration", widget: "string", default: "45 min"}
      - {label: "Descripción", name: "description", widget: "text"}
      - {label: "Archivo de Audio", name: "audio_file", widget: "file"}
      - {label: "Imagen de Portada", name: "cover", widget: "image", required: false}
      
  - name: "video"
    label: "Videos"
    folder: "media/video"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Título", name: "title", widget: "string"}
      - {label: "Fecha", name: "date", widget: "datetime"}
      - {label: "Duración", name: "duration", widget: "string", default: "30 min"}
      - {label: "Descripción", name: "description", widget: "text"}
      - {label: "URL del Video", name: "video_url", widget: "string", hint: "YouTube, Vimeo o archivo directo"}
      - {label: "Archivo de Video", name: "video_file", widget: "file", required: false}
      - {label: "Thumbnail", name: "thumbnail", widget: "image", required: false}
      
  - name: "recursos"
    label: "Recursos (PDFs)"
    folder: "recursos"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Título", name: "title", widget: "string"}
      - {label: "Tipo", name: "type", widget: "select", options: ["Whitepaper", "Guía Técnica", "Manual", "Colección"]}
      - {label: "Descripción", name: "description", widget: "text"}
      - {label: "Archivo PDF", name: "pdf_file", widget: "file"}
      - {label: "Imagen de Portada", name: "cover", widget: "image", required: false}

  - name: "configuracion"
    label: "Configuración del Sitio"
    files:
      - label: "Info General"
        name: "site_info"
        file: "config/site.json"
        fields:
          - {label: "Título del Sitio", name: "site_title", widget: "string", default: "NEXUS"}
          - {label: "Descripción", name: "site_description", widget: "text"}
          - {label: "Email de Contacto", name: "email", widget: "string"}
          - {label: "GitHub URL", name: "github", widget: "string", required: false}
          - {label: "Twitter URL", name: "twitter", widget: "string", required: false}
