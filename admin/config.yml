backend:
  name: git-gateway
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "posts"
    label: "Artículos"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Layout", name: "layout", widget: "hidden", default: "post"}
      - {label: "Título", name: "title", widget: "string"}
      - {label: "Fecha de Publicación", name: "date", widget: "datetime"}
      - {label: "Tiempo de Lectura", name: "readtime", widget: "string", default: "10 min"}
      - {label: "Descripción Corta", name: "description", widget: "text"}
      - {label: "Contenido", name: "body", widget: "markdown"}
      - {label: "PDF Adjunto (URL)", name: "pdf_url", widget: "string", required: false}
      
  - name: "podcast"
    label: "Podcasts"
    folder: "_podcast"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Layout", name: "layout", widget: "hidden", default: "media"}
      - {label: "Tipo", name: "type", widget: "hidden", default: "podcast"}
      - {label: "Título", name: "title", widget: "string"}
      - {label: "Episodio", name: "episode", widget: "string"}
      - {label: "Fecha", name: "date", widget: "datetime"}
      - {label: "Duración", name: "duration", widget: "string", default: "45 min"}
      - {label: "Descripción", name: "description", widget: "text"}
      - {label: "URL del Audio", name: "audio_url", widget: "string"}
      
  - name: "video"
    label: "Videos"
    folder: "_video"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Layout", name: "layout", widget: "hidden", default: "media"}
      - {label: "Tipo", name: "type", widget: "hidden", default: "video"}
      - {label: "Título", name: "title", widget: "string"}
      - {label: "Fecha", name: "date", widget: "datetime"}
      - {label: "Duración", name: "duration", widget: "string", default: "30 min"}
      - {label: "Descripción", name: "description", widget: "text"}
      - {label: "URL del Video", name: "video_url", widget: "string"}
      
  - name: "recursos"
    label: "Recursos (PDFs)"
    folder: "_recursos"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Layout", name: "layout", widget: "hidden", default: "resource"}
      - {label: "Título", name: "title", widget: "string"}
      - {label: "Tipo", name: "type", widget: "select", options: ["Whitepaper", "Guía Técnica", "Manual", "Colección"]}
      - {label: "Descripción", name: "description", widget: "text"}
      - {label: "URL del PDF", name: "pdf_url", widget: "string"}
